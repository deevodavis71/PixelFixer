[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelfixer"
version = "0.1.0"
description = "Remove hot and dead pixels from Nikon NEF raw files, keeping them as NEF"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "rawpy", "pillow"]

[project.scripts]
pixelfixer = "pixelfixer.cli:main"

[tool.setuptools]
packages = ["pixelfixer"]
